{% extends "base.html" %}

{% block title %}Task Form - Hangarin{% endblock %}

{% block content %}

<div class="form-card">

    <h1>Task</h1>

    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="button">
            Save Task
        </button>

        <a href="{% url 'task-list' %}" class="button">
            Cancel
        </a>

    </form>

</div>

{% endblock %}
