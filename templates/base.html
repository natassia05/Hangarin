<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Hangarin{% endblock %}</title>

    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

<nav>
    <div class="nav-container">

        <a href="{% url 'home' %}" class="logo">
            Hangarin
        </a>

        <div>

            <a href="{% url 'home' %}">
                Home
            </a>

            <a href="{% url 'task-list' %}">
                Tasks
            </a>

            <a href="{% url 'task-add' %}">
                Add Task
            </a>

            {% if user.is_authenticated %}

                <form
                    action="{% url 'logout' %}"
                    method="post"
                    style="display: inline;"
                >
                    {% csrf_token %}

                    <button
                        type="submit"
                        class="nav-logout"
                    >
                        Log out
                    </button>
                </form>

            {% else %}

                <a href="{% url 'login' %}">
                    Log in
                </a>

                <a href="{% url 'signup' %}">
                    Sign up
                </a>

            {% endif %}

            <a href="/admin/">
                Admin
            </a>

        </div>

    </div>
</nav>

<main class="container">
    {% block content %}
    {% endblock %}
</main>

</body>
</html>
