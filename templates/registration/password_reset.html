{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Reset Password | Hangarin</title>

    <link
        rel="stylesheet"
        href="{% static 'css/auth.css' %}"
    >

</head>

<body class="auth-page">

    <main class="auth-container">

        <div class="auth-card">

            <div class="auth-brand">

                <div class="brand-mark">H</div>

                <h1>Reset your password</h1>

                <p>
                    Enter your email address and we'll help you
                    reset your password.
                </p>

            </div>


            <form method="post" class="auth-form">

                {% csrf_token %}

                <div class="input-group">

                    <label for="id_email">
                        Email address
                    </label>

                    {{ form.email }}

                </div>


                <button
                    type="submit"
                    class="auth-button"
                >
                    Send reset link
                </button>

            </form>


            <a href="{% url 'login' %}" class="back-home">
                ← Back to login
            </a>

        </div>

    </main>

</body>

</html>
